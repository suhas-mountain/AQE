<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quality &middot; Dharmāyana Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;
  --card:#ffffff;
  --border:#e7e8ec;
  --border-soft:#eef0f3;
  --text:#15181c;
  --text-dim:#6b7280;
  --text-faint:#9aa0aa;
  --accent:#e8590d;
  --accent-dark:#c2410c;
  --accent-soft:#fdece3;
  --accent-muted:#e4a57d;
  --teal:#0f3d3e;
  --green-bg:#dcfce7;
  --green-text:#15803d;
  --green-border:#86efac;
  --red-bg:#fee2e2;
  --red-text:#b91c1c;
  --red-border:#fca5a5;
  --amber-bg:#fef3c7;
  --amber-text:#92400e;
  --amber-border:#fcd34d;
  --violet-bg:#ede9fe;
  --violet-text:#6d28d9;
  --violet-border:#c4b5fd;
  --blue-bg:#dbeafe;
  --blue-text:#1d4ed8;
  --blue-border:#93c5fd;
  --slate-bg:#f1f5f9;
  --slate-text:#475569;
  --slate-border:#cbd5e1;
  --indigo-bg:#eef2ff;
  --indigo-text:#4338ca;
  --indigo-border:#a5b4fc;
  --yellow-bg:#fef9c3;
  --yellow-text:#ca8a04;
  --yellow-border:#fde047;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.04);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
svg{width:16px;height:16px;flex-shrink:0;vertical-align:middle;stroke:currentColor;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#d8dade;border-radius:8px;}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:264px;flex:0 0 264px;background:#fff;border-right:1px solid var(--border);
  min-height:100vh;padding:22px 16px 20px;position:sticky;top:0;align-self:flex-start;
}
.logo{display:flex;align-items:center;gap:8px;padding:2px 8px 26px;}
.logo .balloon{font-size:21px;line-height:1;}
.logo .word{font-size:20px;font-weight:800;color:var(--teal);letter-spacing:.1px;}
.nav-group{margin-bottom:2px;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:10px;
  color:#20242b;font-weight:500;font-size:14px;cursor:pointer;margin-bottom:1px;
}
.nav-item:hover{background:#f5f6f8;}
.nav-item.active{background:var(--accent-dark);color:#fff;font-weight:700;}
.nav-item .ic{width:19px;height:19px;flex:0 0 19px;display:flex;align-items:center;justify-content:center;opacity:.85;}
.nav-item svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.7;}
.nav-item.parent{justify-content:space-between;}
.nav-item.parent .chev{display:flex;opacity:.55;transition:transform .15s;}
.nav-item.parent .chev svg{width:14px;height:14px;stroke-width:2;}
.nav-item.parent.open .chev{transform:rotate(180deg);}
.nav-children{margin-left:19px;padding-left:12px;margin-bottom:4px;}
.nav-children .nav-item{font-size:13.5px;padding:10px 12px;color:#3f4451;}
.nav-children .nav-item .ic{width:16px;height:16px;flex:0 0 16px;opacity:.7;}
.nav-children .nav-item svg{width:16px;height:16px;stroke-width:1.7;}
.nav-children .nav-item.active{color:#fff;}
.nav-new{
  font-size:9px;font-weight:800;color:#fff;background:#1b1b1f;border-radius:5px;
  padding:1px 5px;margin-left:6px;letter-spacing:.4px;
}
.nav-divider{height:1px;background:var(--border-soft);margin:12px 4px;}
.nav-section-label{font-size:10.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;padding:10px 10px 4px;}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:flex-end;padding:16px 34px 0;
}
.avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:#fff;color:#9aa0aa;}
.page-wrap{padding:8px 34px 60px;}
.crumbs{display:flex;align-items:center;gap:7px;color:var(--text-faint);font-size:12.5px;margin-bottom:10px;flex-wrap:wrap;}
.crumbs .sep{opacity:.7;}
.crumbs a:hover{color:var(--accent);}
.crumb-link{cursor:pointer;}
.crumb-link:hover{color:var(--accent);}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.page-title{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:-.2px;}
.page-sub{color:var(--text-dim);font-size:13px;margin:0;max-width:640px;}
.head-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

/* buttons & pills */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap;}
.btn-solid{background:var(--accent);color:#fff;}
.btn-solid:hover{background:var(--accent-dark);}
.btn-outline{background:#fff;border-color:var(--accent);color:var(--accent);}
.btn-outline:hover{background:var(--accent-soft);}
.btn-ghost{background:#fff;border-color:var(--border);color:#374151;}
.btn-ghost:hover{background:#f7f7f8;}
.btn-outline-neutral{background:#fff;border-color:var(--border);color:var(--accent-dark);}
.btn-outline-neutral:hover{background:var(--accent-soft);}
.btn-danger-outline{background:#fff;border-color:#dc2626;color:#dc2626;}
.btn-danger-outline:hover{background:#fef2f2;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btn svg{width:14px;height:14px;stroke:currentColor;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 14px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent;}
.pill-green{background:var(--green-bg);color:var(--green-text);border-color:var(--green-border);}
.pill-red{background:var(--red-bg);color:var(--red-text);border-color:var(--red-border);}
.pill-amber{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber-border);}
.pill-violet{background:var(--violet-bg);color:var(--violet-text);border-color:var(--violet-border);}
.pill-blue{background:var(--blue-bg);color:var(--blue-text);border-color:var(--blue-border);}
.pill-slate{background:var(--slate-bg);color:var(--slate-text);border-color:var(--slate-border);}
.pill-outline{background:#fff;border:1px solid var(--border);color:var(--text-dim);font-weight:600;}
.pill-green-stroke{background:var(--green-bg);color:var(--green-text);border:1px solid var(--green-border);}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:20px;}
.card h3{margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid var(--border-soft);font-size:15px;font-weight:800;display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.card h3 .count{color:var(--text-faint);font-weight:600;font-size:11.5px;letter-spacing:0;text-transform:none;}
.card > p.page-sub:first-child{margin-top:-4px;}

/* tabs */
.tabbar{display:flex;gap:4px;background:#eef0f3;padding:4px;border-radius:11px;width:fit-content;margin-bottom:18px;}
.tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;color:#5b6270;cursor:pointer;}
.tab.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.08);}
.tab.disabled{opacity:.45;cursor:not-allowed;}

/* filter bar */
.filterbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.search-box{flex:1;min-width:220px;position:relative;}
.search-box input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:9px;font-size:13px;background:#fff;}
.search-box .sic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-faint);}
select.chip-select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  border:1px solid var(--border);background:#fff;border-radius:9px;
  padding:9px 30px 9px 13px;font-size:13px;font-family:inherit;color:#20242b;font-weight:500;
  cursor:pointer;height:38px;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:13px;
}
select.chip-select:hover{border-color:#c7cad0;}
select.chip-select:focus{outline:none;border-color:var(--accent);}
.filter-select-wrap{position:relative;display:inline-block;}
select.chip-select.select-active{
  border-color:var(--accent);color:var(--accent-dark);background-color:var(--accent-soft);font-weight:500;
  border-radius:11px;padding:9px 32px 9px 15px;background-image:none;
}
.select-clear-btn{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border-radius:50%;border:none;background:transparent;padding:0;
  color:var(--accent-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.select-clear-btn:hover{background:#fbdcc9;color:var(--accent);}
.select-clear-btn svg{width:14px;height:14px;}
.filterbar .btn-ghost{height:38px;}
.daterange-group{display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:#fff;border-radius:9px;padding:0 12px;height:38px;color:#374151;}
.daterange-group svg{color:#6b7280;}
.daterange-group input[type=date]{border:none;font-family:inherit;font-size:12.5px;color:#20242b;padding:0;width:104px;}
.daterange-group input[type=date]:focus{outline:none;}
.daterange-sep{color:var(--text-faint);font-size:12px;}
.btn-apply{background:#eef0f3;color:var(--accent);border:none;font-weight:700;height:38px;}
.btn-apply:hover{background:#e5e7eb;}
.search-with-btn{display:flex;gap:8px;}
.search-with-btn .search-box input{height:38px;}
.search-with-btn .btn{height:38px;}
.filter-tag{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:11px;padding:7px 9px 7px 15px;font-size:12.5px;font-weight:500;}
.filter-tag button{border:none;background:transparent;color:var(--accent-muted);cursor:pointer;display:flex;align-items:center;padding:2px;border-radius:50%;}
.filter-tag button:hover{background:#fbdcc9;color:var(--accent);}
.filter-tag svg{width:15px;height:15px;}
.active-filters-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 0 0;}
.chip-btn{border:1px solid var(--border);background:#fff;border-radius:7px;padding:6px 13px;font-size:12.5px;font-weight:600;color:#4b5563;cursor:pointer;}
.sla-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;flex:0 0 7px;}
.order-urgency{font-size:11px;font-weight:700;margin-top:2px;}
.order-urgency.sla-breached{color:#dc2626;}
.order-urgency.sla-atrisk{color:#d97706;}
.order-urgency.sla-met{color:#2563eb;}
.hamburger{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#374151;flex:0 0 34px;}
.hamburger:hover{background:#f7f7f8;}
.hamburger svg{width:17px;height:17px;}
.crumbs-row{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
.sidebar.collapsed{width:0;flex:0 0 0;padding:0;overflow:hidden;border-right:none;}
.action-dots{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:#6b7280;cursor:pointer;}
.action-dots svg{width:15px;height:15px;}
.action-check{width:30px;height:30px;border-radius:8px;border:1px solid var(--accent-soft);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--accent);cursor:pointer;}
.action-check svg{width:15px;height:15px;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.chip-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* table */
table{width:100%;border-collapse:collapse;}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);font-weight:700;padding:0 12px 10px;border-bottom:1px solid var(--border);}
tbody td{padding:13px 12px;border-bottom:1px solid var(--border-soft);font-size:13px;vertical-align:middle;}
tbody tr{cursor:pointer;}
tbody tr:hover td{background:#fafafb;}
tbody tr.row-breach td{background:#fff7f6;}
tbody tr.row-breach:hover td{background:#fdeceb;}
tbody tr.row-reviewed{opacity:.62;}
tbody tr.row-expired{opacity:.62;}
.order-id{font-weight:700;color:var(--text);}
.mono{font-variant-numeric:tabular-nums;}
.sub{color:var(--text-faint);font-size:11.5px;}
.flag-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;}
.flag-misconduct{background:var(--red-bg);color:var(--red-text);}
.flag-integrity{background:var(--violet-bg);color:var(--violet-text);}
.flag-wrong_language{background:var(--blue-bg);color:var(--blue-text);}
.flag-low_quality{background:var(--amber-bg);color:var(--amber-text);}
.flag-blind{background:var(--indigo-bg);color:var(--indigo-text);}
.breach-tag{color:#b91c1c;font-weight:700;font-size:11px;display:flex;align-items:center;gap:4px;}
.repeat-count{font-weight:700;}
.repeat-count.warn{color:#b45309;}
.repeat-count.danger{color:#b91c1c;}
.empty-row td{text-align:center;color:var(--text-faint);padding:40px 0;}

/* dimension strip */
.dim-strip{display:flex;gap:12px;flex-wrap:wrap;}
.dim-chip{border:1px solid var(--border);border-radius:12px;padding:14px 18px;min-width:120px;flex:1;text-align:center;background:#fafbfc;}
.dim-chip .dl{font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.dim-chip .dv{font-size:24px;font-weight:800;}
.dim-chip.score-3{background:#f2fbf5;border-color:#cdeed9;}
.dim-chip.score-3 .dv{color:#15803d;}
.dim-chip.score-2{background:#fffaf0;border-color:#fbe3ae;}
.dim-chip.score-2 .dv{color:#b45309;}
.dim-chip.score-low{background:#fef4f3;border-color:#f6c9c6;}
.dim-chip.score-low .dv{color:#b91c1c;}
.dim-chip.score-na{background:#f7f7f8;border-color:var(--border);}
.dim-chip.score-na .dv{color:var(--text-faint);font-size:16px;}
.dim-chip.final{background:#15181c;border-color:#15181c;}
.dim-chip.final .dl{color:#c7cad0;}
.dim-chip.final .dv{color:#fff;}

/* question rows */
.q-dim{margin-bottom:22px;border:1.5px solid var(--border);border-radius:12px;padding:14px 16px 18px;}
.q-dim:last-child{margin-bottom:0;}
.q-dim-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;margin:-14px -16px 12px;background:var(--border-soft);border-radius:10px 10px 0 0;color:var(--text);}
.q-dim-head .q-dim-name{font-weight:800;font-size:13px;}
.q-dim.dim-s{border-color:var(--blue-bg);}
.q-dim.dim-s .q-dim-head{background:var(--blue-bg);color:var(--blue-text);}
.q-dim.dim-p{border-color:var(--violet-bg);}
.q-dim.dim-p .q-dim-head{background:var(--violet-bg);color:var(--violet-text);}
.q-dim.dim-a{border-color:var(--green-bg);}
.q-dim.dim-a .q-dim-head{background:var(--green-bg);color:var(--green-text);}
.q-dim.dim-e{border-color:var(--amber-bg);}
.q-dim.dim-e .q-dim-head{background:var(--amber-bg);color:var(--amber-text);}
.q-result{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:999px;font-weight:700;font-size:11px;white-space:nowrap;flex:0 0 auto;}
.q-result svg{width:11px;height:11px;stroke-width:3;}
.q-result.r1{background:var(--green-bg);color:var(--green-text);}
.q-result.r0{background:var(--red-bg);color:var(--red-text);}
.q-result.rna{background:var(--slate-bg);color:var(--text-faint);}
.q-row{padding:12px 0;}
.q-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;}
.q-top .qq{font-size:13px;font-weight:700;color:var(--teal);flex:1;min-width:0;}
.q-answer{margin:7px 0 0;}
.q-answer .src{font-size:13px;margin-bottom:4px;font-style:italic;color:var(--text);}
.q-answer .eng{font-size:12.5px;color:var(--text);}
.q-answer .redacted{font-size:12.5px;color:var(--red-text);font-weight:600;margin-bottom:4px;}
.jump-inline{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:none;border-radius:6px;padding:4px 10px;margin-left:8px;cursor:pointer;white-space:nowrap;vertical-align:middle;}
.jump-inline svg{width:11px;height:11px;}
.jump-inline:hover{background:#fbdcc9;}
.src-tag{font-size:10.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;background:#eef0f3;padding:3px 7px;border-radius:6px;}

/* recording player */
.player{display:flex;align-items:center;gap:12px;background:#15181c;border-radius:12px;padding:12px 16px;color:#fff;margin-bottom:14px;}
.player button.play{width:34px;height:34px;border-radius:50%;background:var(--accent);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 34px;}
.player .ptrack{flex:1;height:5px;background:#3a3d42;border-radius:3px;position:relative;cursor:pointer;}
.player .pfill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;width:0%;}
.player .ptime{font-size:11.5px;font-variant-numeric:tabular-nums;color:#cfd2d8;min-width:86px;text-align:right;}
.player .plabel{font-size:11.5px;color:#9aa0aa;min-width:110px;}

/* banners */
.banner{border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start;}
.banner-info{background:#eef4ff;border:1px solid #cfe0ff;color:#1d4ed8;}
.banner-warn{background:#fff8e6;border:1px solid #fbe3ae;color:#92400e;}
.banner-restrict{background:#f7f7f8;border:1px solid var(--border);color:#4b5563;}
.banner strong{display:block;margin-bottom:2px;}

/* verdict panel */
.cond-card{border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
.cond-card.st-pending{border-left-color:var(--accent);}
.cond-card.st-confirmed{border-left-color:var(--green-text);}
.cond-card.st-rejected{border-left-color:var(--slate-text);}
.cond-card.locked{opacity:.55;border-left-color:#e5e7eb;}
.cond-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.cond-head .left{display:flex;align-items:center;gap:10px;}
.verdict-status{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;}
textarea.notes{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13px;resize:vertical;min-height:56px;margin-top:8px;}
.checklist{display:flex;flex-direction:column;gap:6px;margin:10px 0;}
.checklist label{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#374151;}
.gate-box{background:#fff8e6;border:1px solid #fbe3ae;border-radius:9px;padding:10px 12px;font-size:12.5px;color:#92400e;margin:10px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.gate-ok{background:#f2fbf5;border-color:#cdeed9;color:#15803d;}
.action-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.coach-box{background:#fafbfc;border:1px dashed var(--border);border-radius:9px;padding:12px 14px;margin-top:10px;}
.coach-box .row{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;}
.coach-box input[type=date]{border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:inherit;}
.coach-box input[type=text]{flex:1;min-width:180px;border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:inherit;}

/* misc */
.kv{display:grid;grid-template-columns:150px 1fr;gap:10px 0;}
.kv .k{color:var(--text-faint);font-size:12.5px;}
.kv .v{font-weight:600;font-size:13px;}
.lock-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--text-faint);}
.lock-badge svg{width:13px;height:13px;}
.meta-row{display:flex;flex-wrap:wrap;gap:14px 22px;margin:6px 0 0;}
.meta-row .mi{font-size:13px;}
.meta-row .mi .mk{color:var(--text-faint);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:2px;}
.meta-row .mi .mv{font-weight:700;color:#20242b;}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px;}
.stat-card{background:#fff;border:1px solid var(--border);border-top:4px solid var(--border);border-radius:14px;padding:16px 18px;}
.stat-card .stat-lbl{font-size:11px;font-weight:700;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase;}
.stat-card .stat-num{font-size:27px;font-weight:800;margin-top:6px;color:#20242b;}
.stat-card .stat-updated{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-faint);margin-top:10px;}
.stat-card .stat-updated svg{width:12px;height:12px;stroke-width:2.2;}
.stat-card.tone-orange{border-top-color:var(--accent);}
.stat-card.tone-orange .stat-num{color:var(--accent);}
.stat-card.tone-red{border-top-color:var(--red-text);}
.stat-card.tone-red .stat-num{color:var(--red-text);}
.stat-card.tone-blue{border-top-color:var(--blue-text);}
.stat-card.tone-blue .stat-num{color:var(--blue-text);}
.stat-card.tone-amber{border-top-color:var(--amber-text);}
.stat-card.tone-amber .stat-num{color:var(--amber-text);}
.stat-card.tone-indigo{border-top-color:var(--indigo-text);}
.stat-card.tone-indigo .stat-num{color:var(--indigo-text);}
.stat-card.tone-green{border-top-color:var(--green-text);}
.stat-card.tone-green .stat-num{color:var(--green-text);}
.stat-card.tone-yellow{border-top-color:var(--yellow-text);}
.stat-card.tone-yellow .stat-num{color:var(--yellow-text);}
.stat-card.tone-slate{border-top-color:var(--slate-text);}
.stat-card.tone-slate .stat-num{color:var(--slate-text);}
.urgent-chip{display:inline-flex;align-items:center;gap:4px;color:var(--red-text);font-weight:700;font-size:11px;letter-spacing:0;text-transform:none;margin-left:4px;}
.pagination-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:14px 18px;}
.pagination-summary{font-size:12.5px;color:var(--text-dim);}
.pagination-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.page-num{width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--text-dim);cursor:pointer;}
.page-num:hover{background:#f7f7f8;}
.page-num.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.settings-row{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:16px 0;border-bottom:1px solid var(--border-soft);}
.settings-row:last-child{border-bottom:none;}
.settings-row .label{font-weight:700;font-size:13.5px;margin-bottom:3px;}
.settings-row .desc{color:var(--text-dim);font-size:12.5px;max-width:480px;}
.toggle{width:42px;height:24px;border-radius:999px;background:#d7dade;position:relative;cursor:pointer;flex:0 0 42px;transition:background .15s;}
.toggle.on{background:var(--accent);}
.toggle .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.toggle.on .knob{left:20px;}
.num-input{width:70px;border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;text-align:center;}
.rule-line{color:var(--text-dim);font-size:12.5px;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,18,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;z-index:100;overflow:auto;}
.modal-box{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-box h2{margin:0 0 4px;font-size:19px;font-weight:800;}
.modal-close{position:absolute;top:0;right:0;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;}
.x-btn{border:none;background:#f1f2f4;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;color:#555;}
.rubric-dim{margin-top:16px;}
.rubric-dim h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-dark);}
.rubric-dim ol{margin:0;padding-left:18px;font-size:13px;}
.rubric-dim li{margin-bottom:5px;}

/* toast */
#toast-root{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:#15181c;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastin .2s ease;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media (max-width:900px){.two-col{grid-template-columns:1fr;}}
</style>
</head>

    <div class="topbar">
      <div class="avatar" id="avatar"></div>

    <div class="page-wrap">
      <div class="crumbs-row">
        <div class="hamburger" id="hamburger" onclick="toggleSidebar()"></div>
        <div class="crumbs" id="crumbs"></div>
      </div>
      <div id="view-root"></div>
    </div>
  </div>
</div>

<div id="toast-root"></div>

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ageLabel(iso){

/* ---------------- SLA (mirrors the existing CC "SLA Status" pattern: No Risk / At Risk / Met / Breached) ---------------- */
const SLA_LABEL = {no_risk:'No Risk', at_risk:'At Risk', met:'Met', breached:'Breached'};
const SLA_PILL = {no_risk:'pill-outline', at_risk:'pill-amber', met:'pill-blue', breached:'pill-red'};
const SLA_BAR = {no_risk:'#c9ccd2', at_risk:'#d97706', met:'#2563eb', breached:'#dc2626'};
function slaWindowHours(flag){ return flag==='misconduct' ? 24 : 72; } // same working day vs 3 working days, approximated
function slaRiskWindowHours(flag){ return flag==='misconduct' ? 6 : 24; }
function slaDeadline(item){ return new Date(new Date(item.completedAt).getTime() + slaWindowHours(item.flag)*3600000); }
function conditionVerdictList(d){
  if(!d) return [];
  if(d.isBlindSample) return d.verdicts.blind ? [d.verdicts.blind] : [];
  return Object.values(d.verdicts||{});
}
function isOrderReviewed(id){
  const d = getDetail(id);
  if(!d) return false;
  if(d.isBlindSample) return !!(d.verdicts.blind && d.verdicts.blind.status!=='pending');
  const conds = d.triggeredConditions||[];
  if(!conds.length) return true;
  return conds.every(c=> d.verdicts[c] && d.verdicts[c].status!=='pending');
}
function latestReviewedAt(id){
  const d = getDetail(id);
  const times = conditionVerdictList(d).filter(v=>v&&v.reviewedAtRaw).map(v=>new Date(v.reviewedAtRaw));
  if(!times.length) return null;
  return new Date(Math.max.apply(null, times));
}
function slaStatusOf(item){
  const deadline = slaDeadline(item);
  if(isOrderReviewed(item.id)){
    const at = latestReviewedAt(item.id);
    if(!at) return 'met';
    return at<=deadline ? 'met' : 'breached';
  }
  const remainingMs = deadline-NOW;
  if(remainingMs<=0) return 'breached';
  if(remainingMs<=slaRiskWindowHours(item.flag)*3600000) return 'at_risk';
  return 'no_risk';
}
function slaUrgencyLine(item){
  const st = slaStatusOf(item);
  const deadline = slaDeadline(item);
  if(st==='breached'){
    const overdueMs = NOW-deadline;
    const h = Math.max(0,Math.floor(overdueMs/3600000));
    return {text:(h>=24?Math.floor(h/24)+'d overdue':h+'h overdue'), cls:'sla-breached'};
  }
  if(st==='at_risk'){
    const leftMs = deadline-NOW;
    const h = Math.max(0,Math.floor(leftMs/3600000));
    return {text:h+'h left', cls:'sla-atrisk'};
  }
  if(st==='met') return {text:'Met SLA', cls:'sla-met'};
  return null; // no_risk: nothing urgent enough to call out inline
}
function dateLabel(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) + ' · ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
function scoreClass(score){
  if(score==null) return 'score-na';
  if(score>=3) return 'score-3';
  if(score>=2) return 'score-2';
  return 'score-low';
}
function toast(msg){
  const root = document.getElementById('toast-root');
  const t = document.createElement('div');
  t.className='toast';
  t.textContent = msg;
  root.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 2600);
}

}

/* ---------------- fake audio player ---------------- */
let currentPlayerOrder = null;
function initPlayer(orderId, durationLabelSeconds){
  currentPlayerOrder = {orderId, fictionalDuration: durationLabelSeconds};
}
function fmtClock(totalSeconds){
  const m = Math.floor(totalSeconds/60), s = Math.floor(totalSeconds%60);
  return m+':' + (s<10?'0':'')+s;
}
function togglePlay(){
  const audio = document.getElementById('rec-audio');
  const btn = document.getElementById('play-btn');
  if(audio.paused){ audio.play(); btn.innerHTML = ICONS.pause; }
  else { audio.pause(); btn.innerHTML = ICONS.play; }
}
function seekTrack(e){
  const audio = document.getElementById('rec-audio');
  const track = document.getElementById('ptrack');
  const rect = track.getBoundingClientRect();
  const ratio = Math.min(1,Math.max(0,(e.clientX-rect.left)/rect.width));
  audio.currentTime = ratio * (audio.duration||30);
}
function jumpAudio(fictionalSeconds, condType, orderId){
  const audio = document.getElementById('rec-audio');
  const dur = currentPlayerOrder ? currentPlayerOrder.fictionalDuration : 1200;
  const ratio = Math.min(1, fictionalSeconds/dur);
  const realDur = audio.duration && !isNaN(audio.duration) ? audio.duration : 30;
  audio.currentTime = ratio*realDur;
  audio.play();
  document.getElementById('play-btn') && (document.getElementById('play-btn').innerHTML = ICONS.pause);
  if(condType && orderId){ markGatePlayed(orderId, condType); }
  toast('Jumped to '+fmtClock(fictionalSeconds)+' in the recording');
}
setInterval(()=>{
  const audio = document.getElementById('rec-audio');
  const fill = document.getElementById('pfill');
  const timeEl = document.getElementById('ptime');
  if(!audio || !fill || !currentPlayerOrder) return;
  const dur = currentPlayerOrder.fictionalDuration;
  const realDur = audio.duration && !isNaN(audio.duration) ? audio.duration : 30;
  const fictionalNow = (audio.currentTime/realDur)*dur;
  fill.style.width = Math.min(100,(fictionalNow/dur*100))+'%';
  if(timeEl) timeEl.textContent = fmtClock(fictionalNow)+' / '+fmtClock(dur);
  const btn = document.getElementById('play-btn');
  if(btn) btn.innerHTML = audio.paused ? ICONS.play : ICONS.pause;
}, 250);

const GATE_PLAYED = {}; // orderId -> {condType:true}

/* generic fallback for queue rows without a full mock detail — short evaluator-style
   notes per rubric question, keyed on pass/fail, so unauthored orders still read as
   real evidence instead of placeholder text. */
const GENERIC_EVIDENCE = {
  S1:{pass:"Mitra acknowledged the user's concern early in the call.", fail:"Did not clearly acknowledge the user's core concern."},
  S2:{pass:'Follow-up questions drew out relevant background before advising.', fail:'Little follow-up on background before moving to advice.'},
  S3:{pass:'Understanding was confirmed with the user before proceeding.', fail:'Proceeded without confirming understanding with the user.'},
  P1:{pass:'Remedies given were specific and tied to a clear benefit.', fail:'Remedies were vague and lacked a stated benefit.'},
  P2:{pass:'Remedies stayed consistent across the consultation.', fail:'Remedies shifted or contradicted earlier in the call.'},
  P3:{pass:'Timing guidance was included where relevant.', fail:'Timing guidance was missing where it applied.'},
  A1:{pass:"Analysis was specific to this user's situation.", fail:'Analysis read as generic rather than user-specific.'},
  A2:{pass:"Chart details were tied directly to the user's question.", fail:"Chart details weren't clearly connected to the question."},
  A3:{pass:'Relevant timing factors were addressed.', fail:'Relevant timing factors were not addressed.'},
  E1:{pass:'Tone stayed calm, warm, and respectful throughout.', fail:'Tone fell short of calm and respectful at points.'},
  E2:{pass:'No fear-selling or unwarranted upsell detected.', fail:'Fear-based language or upsell pressure was present.'},
  E3:{pass:'Language quality met the expected standard.', fail:'Language quality was below the expected standard.'},
};
function genericDetail(item){
  const d = {
    id:item.id, service:item.service, kind: item.service==='Prashna' ? 'prashna':'voice', mitra:item.mitra,
    bookedLanguage:item.lang, detectedLanguage:item.lang, completedAt:item.completedAt,
    rubricVersion:'v1.2', evaluatorVersion:'claude-sonnet-4.5 · prompt v1.4',
    recording:{durationSeconds: 12*60+30}, generic:true,
    scoredDimensions: item.service==='Dharmik Counselling' ? [] : ['S','P','A','E'],
    dimensions:{}, triggeredConditions: item.flag ? [item.flag, ...item.other] : [], surfacedFlag:item.flag,
    isBlindSample: item.blind, supersedes:null, verdicts:{}
  };
  if(!item.service.includes('Counselling')){
    ['S','P','A','E'].forEach((k,i)=>{
      const base = item.score==null ? 2 : Math.min(3, item.score + (i===3?0:1));
      d.dimensions[k] = {score: k==='E'? (item.score==null?3:Math.max(item.score,1)) : base, qs: RUBRIC.dims[k].qs.map(q=>{
        const result = (base>=2 || k==='E') ? 1 : 0;
        const note = GENERIC_EVIDENCE[q.id] || {pass:'Evidence supports a pass on this point.', fail:'Evidence indicates a gap on this point.'};
        return {id:q.id, result, ts:0, src:null, noTs:true, en: result===1 ? note.pass : note.fail};
      })};
    });
  }
  const seedReviewed = item.status==='reviewed';
  const seedStamp = seedReviewed ? {reviewedAtRaw:new Date(new Date(item.completedAt).getTime()+3*3600000).toISOString(), reviewedAt:dateLabel(new Date(new Date(item.completedAt).getTime()+3*3600000).toISOString())} : {reviewedAt:''};
  if(item.blind){ d.verdicts.blind = Object.assign({status: seedReviewed?'confirmed':'pending', missedQs:[], notes:'', reviewer: seedReviewed?'You (HQE)':''}, seedStamp); }
  else {
    (d.triggeredConditions.length?d.triggeredConditions:['low_quality']).forEach(c=>{
      d.verdicts[c] = Object.assign({status: seedReviewed ? 'confirmed':'pending', wrongQs:[], notes:'', reviewer: seedReviewed?'You (HQE)':'', coaching:{done:seedReviewed,date:seedReviewed?'2026-08-07':'',note:seedReviewed?'Coached on remedy specificity.':''}}, seedStamp);
    });
  }
  return d;
}
// Orders without a fully-authored DETAILS entry get one generated on demand
// (genericDetail). That generated object must be cached and reused — otherwise every
// getDetail() call rebuilds a fresh object from the static seed, silently discarding
// any verdict/coaching mutation made on a prior render.
const GENERIC_DETAIL_CACHE = {};
function getDetail(id){
  if(DETAILS[id]) return DETAILS[id];
  if(GENERIC_DETAIL_CACHE[id]) return GENERIC_DETAIL_CACHE[id];
  const item = QUEUE.find(q=>q.id===id);
  if(!item) return null;
  const d = genericDetail(item);
  GENERIC_DETAIL_CACHE[id] = d;
  return d;
}

function setCrumbs(parts){
  // Clickable crumbs navigate the same way the rest of the app does — a nav() call on
  // a plain element — rather than a real <a href> anchor. Kept consistent everywhere
  // (previously "Quality" was a dead span on the queue/digest/settings pages but a real
  // link on the order page).
  document.getElementById('crumbs').innerHTML = parts.map((p,i)=>{
    const isLast = i===parts.length-1;
    const clickable = p.href && !isLast;
    return (i>0?'<span class="sep">&#8250;</span>':'') +
      (clickable
        ? '<span class="crumb-link" onclick="nav(\''+p.href.slice(1)+'\')">'+esc(p.label)+'</span>'
        : '<span'+(isLast?' style="color:#374151;font-weight:600;"':'')+'>'+esc(p.label)+'</span>');
  }).join('');
}

/* ---- Not Evaluable Orders: search & filter (mirrors the Queue's filter bar) ---- */
const DIGEST_DEFAULT_FILTER = {q:'', service:'all', reason:'all', from:'', to:''};
let dqFilter = Object.assign({}, DIGEST_DEFAULT_FILTER);   // applied
let dpFilter = Object.assign({}, DIGEST_DEFAULT_FILTER);   // pending/staged
const DIGEST_SERVICES = Array.from(new Set(DIGEST.map(e=>e.service))).sort();
function filteredDigest(){
  return DIGEST.filter(e=>{
    if(dqFilter.service!=='all' && e.service!==dqFilter.service) return false;
    if(dqFilter.reason!=='all' && e.reason!==dqFilter.reason) return false;
    if(dqFilter.from && new Date(e.date) < new Date(dqFilter.from)) return false;
    if(dqFilter.to && new Date(e.date) > new Date(dqFilter.to+'T23:59:59')) return false;
    if(dqFilter.q){
      const hay = (e.id+' '+e.service).toLowerCase();
      if(!hay.includes(dqFilter.q.toLowerCase())) return false;
    }
    return true;
  }).sort((a,b)=> new Date(b.date)-new Date(a.date));
}
function isDigestFilterActive(){
  return Object.keys(DIGEST_DEFAULT_FILTER).some(k=>dqFilter[k]!==DIGEST_DEFAULT_FILTER[k]);
}
function activeDigestFilterChipsHtml(){
  const chips = [];

  return '<div class="active-filters-row">'+chips.join('')+'</div>';

function flagBadge(flag, isBlind){
  if(isBlind) return '<span class="flag-badge flag-blind">&#9673; Blind Sample</span>';
  if(!flag) return '<span class="pill-outline pill" style="border-style:dashed;">Clean</span>';

// Requirement 1: non-misconduct flags expire from the queue, unverdicted, after
// CONFIG.queueExpiryDays (default 30) — excluded from the Open/Pending stat and
// metrics, but still visible and findable via the Expired filter. Misconduct and
// blind-calibration samples never expire.
function ageDays(iso){ return Math.floor((NOW-new Date(iso))/86400000); }
function queueStatusOf(item){
  if(isOrderReviewed(item.id)) return 'reviewed';
  if(!item.blind && item.flag && item.flag!=='misconduct' && ageDays(item.completedAt) > CONFIG.queueExpiryDays) return 'expired';
  return 'pending';
}
function reviewStatusOf(item){
  const st = queueStatusOf(item);
  if(st==='reviewed') return {label:'Reviewed', cls:'pill-green-stroke'};
  if(st==='expired') return {label:'Expired', cls:'pill-slate'};
  return {label:'Pending', cls:'pill-outline'};
}
function langShort(lang){ return lang.split(' ')[0].replace('(','').replace(',',''); }
const ALL_LANGS = ['Hindi','English','Kannada','Marathi','Bengali','Telugu','Gujarati','Tamil','Malayalam'];
const ALL_SERVICES = ['Talk to a Jyotishi','Prashna','Ayurveda Consultation','Dharmik Counselling','Kundali Matching'];

function sortedQueue(){
  return QUEUE.slice().sort((a,b)=>{
    const pa = a.flag ? FLAG_PRIORITY[a.flag] : 9;
    const pb = b.flag ? FLAG_PRIORITY[b.flag] : 9;
    if(pa!==pb) return pa-pb;
    return ageSortDir * (new Date(a.completedAt) - new Date(b.completedAt));
  });
}
function filteredQueue(){
  return sortedQueue().filter(item=>{
    const st = queueStatusOf(item);
    if(qFilter.review==='open' && st!=='pending') return false;
    if(qFilter.review==='reviewed' && st!=='reviewed') return false;
    if(qFilter.review==='expired' && st!=='expired') return false;
    if(qFilter.sla!=='all' && slaStatusOf(item)!==qFilter.sla) return false;
    if(qFilter.service!=='all' && item.service!==qFilter.service) return false;
    if(qFilter.mitra!=='all' && item.mitra!==qFilter.mitra) return false;
    if(qFilter.flag!=='all'){
      if(qFilter.flag==='blind' && !item.blind) return false;
      if(qFilter.flag!=='blind' && item.flag!==qFilter.flag) return false;
    }
    if(qFilter.lang!=='all' && langShort(item.lang)!==qFilter.lang) return false;
    if(qFilter.from && new Date(item.completedAt) < new Date(qFilter.from)) return false;
    if(qFilter.to && new Date(item.completedAt) > new Date(qFilter.to+'T23:59:59')) return false;
    if(qFilter.q){
      const hay = (item.id+' '+item.service+' '+MITRAS[item.mitra].name+' '+item.lang).toLowerCase();
      if(!hay.includes(qFilter.q.toLowerCase())) return false;
    }
    return true;
  });
}

function finalScoreOf(d){
  const vals = (d.scoredDimensions||[]).map(k=>d.dimensions[k].score).filter(v=>v!=null);
  if(!vals.length) return null;
  return Math.min.apply(null, vals);
}
function avgScoreOf(d){
  const vals = (d.scoredDimensions||[]).map(k=>d.dimensions[k].score).filter(v=>v!=null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

  if(cond==='integrity'){
    const dim = d.dimensions.E;
    const q = dim && dim.qs.find(function(q){ return q.id==='E2'; });
    return q ? q.ts : 0;
  }
  if(cond==='misconduct'){
    var dims = d.scoredDimensions||[];
    for(var i=0;i<dims.length;i++){
      var qs = d.dimensions[dims[i]].qs;
      for(var j=0;j<qs.length;j++){ if(qs[j].redacted) return qs[j].ts; }
    }
    return 0;
  }
  return 0;
}
function conditionContextLine(d, cond){
  if(cond==='misconduct') return 'Party: '+(d.misconductParty==='user'?'User (never feeds Mitra quality trends)':'Mitra (escalation path, not coaching)')+'. Raised regardless of scores.';
  if(cond==='integrity') return 'The Etiquette integrity question (E2) failed — fear-selling / doom language / unwarranted upsell. Raised regardless of final score.';
  if(cond==='wrong_language') return 'Booked language: <b>'+esc(d.bookedLanguage)+'</b> &middot; Detected delivered language: <b>'+esc(d.detectedLanguage)+'</b>. The booked language is the contract.';
  if(cond==='low_quality') return 'Final score '+finalScoreOf(d)+' (threshold &le; '+CONFIG.lowScoreThreshold+') or dimension average '+ (avgScoreOf(d)!=null?avgScoreOf(d).toFixed(2):'—') +' (threshold &le; '+CONFIG.lowAvgThreshold+').';
  return '';
}

function allQuestionOptions(d){
  const out = [];
  (d.scoredDimensions||[]).forEach(k=>{ d.dimensions[k].qs.forEach(q=>{ out.push({id:q.id, dim:k}); }); });
  return out;
}

function renderVerdictPanel(d){
  let html = '<div class="card"><h3>Verdict</h3>';
  if(d.isBlindSample){
    const v = d.verdicts.blind;
    const statusPill = v.status==='pending' ? '<span class="verdict-status pill-amber">Pending</span>' :
      v.status==='confirmed' ? '<span class="verdict-status pill-slate">Correctly Clean</span>' : '<span class="verdict-status pill-red">Should Have Flagged</span>';
    html += '<div class="cond-card st-'+(v.status==='pending'?'pending':v.status==='confirmed'?'confirmed':'rejected')+'">'+
      '<div class="cond-head"><div class="left"><span class="flag-badge flag-blind">&#9673; Blind calibration sample</span>'+statusPill+'</div></div>'+
      '<p class="rule-line">Clean order inserted at random for blind review. Verdict feeds the miss-rate metric.</p>';
    if(v.status==='pending'){
      if(v.history && v.history.length){
        const last = v.history[v.history.length-1];
        html += '<p class="rule-line"><em>Previously recorded '+(last.reviewedAt||'—')+' by '+(last.reviewer||'—')+' — reopened for correction. Record a new verdict below.</em></p>';
      }
      html += '<div id="blind-reject-form" style="display:none;">'+
        '<div class="checklist">'+ allQuestionOptions(d).map(o=>'<label><input type="checkbox" data-blind-q="'+o.id+'"> '+o.id+' &mdash; '+esc(RUBRIC.dims[o.dim].qs.find(q=>q.id===o.id).text)+'</label>').join('') +'</div>'+
        '<textarea class="notes" id="blind-notes" placeholder="Notes (optional)"></textarea>'+
        '<div class="action-row"><button class="btn btn-solid" onclick="submitBlind(\''+d.id+'\')">Submit: Should Have Flagged</button><button class="btn btn-ghost" onclick="document.getElementById(\'blind-reject-form\').style.display=\'none\'">Cancel</button></div>'+
      '</div>'+
      '<div class="action-row"><button class="btn btn-solid" onclick="blindCorrectlyClean(\''+d.id+'\')">Correctly Clean</button><button class="btn btn-outline" onclick="document.getElementById(\'blind-reject-form\').style.display=\'block\'">Should Have Flagged</button></div>';
    } else {
      html += '<p class="rule-line">Recorded '+ (v.reviewedAt||'—') +' by '+(v.reviewer||'—')+'.'+(v.notes?' Notes: '+esc(v.notes):'')+'</p>'+
        '<div class="action-row"><button class="btn btn-sm btn-outline-neutral" onclick="reopenBlindVerdict(\''+d.id+'\')">Correct verdict</button></div>';
    }
    html += '</div>';
    html += '</div>';
    return html;
  }

  const conds = (d.triggeredConditions||[]).slice().sort((a,b)=>FLAG_PRIORITY[a]-FLAG_PRIORITY[b]);
  if(!conds.length){ html += '<p class="page-sub">No triggered conditions on this evaluation — nothing to verdict.</p></div>'; return html; }

  let firstPendingSeen = false;
  conds.forEach(cond=>{
    const v = d.verdicts[cond] || {status:'pending', wrongQs:[], notes:'', coaching:{done:false,date:'',note:''}};
    const isPending = v.status==='pending';
    const isActive = isPending && !firstPendingSeen;
    if(isPending) firstPendingSeen = true;
    const locked = isPending && !isActive;
    const gateNeeded = (cond==='misconduct'||cond==='integrity');
    const gatePassed = GATE_PLAYED[d.id] && GATE_PLAYED[d.id][cond];
    const statusPill = v.status==='confirmed' ? '<span class="verdict-status pill-green">Confirmed</span>' :
      v.status==='rejected' ? '<span class="verdict-status pill-slate">Rejected</span>' :
      locked ? '<span class="verdict-status pill-outline pill">Queued</span>' : '<span class="verdict-status pill-amber">Pending</span>';

    html += '<div class="cond-card'+(locked?' locked':isActive?' st-pending':v.status==='confirmed'?' st-confirmed':v.status==='rejected'?' st-rejected':'')+'">'+
      '<div class="cond-head"><div class="left"><span class="flag-badge flag-'+cond+'"><span class="dot"></span>'+esc(FLAG_LABEL[cond])+'</span>'+statusPill+'</div></div>'+
      '<p class="rule-line" style="margin:0 0 8px;">'+conditionContextLine(d,cond)+'</p>';

    if(locked){
      html += '<p class="rule-line" style="margin:0;">Waiting on a higher-priority condition above.</p>';
    } else if(v.status==='confirmed'){
      html += '<p class="rule-line">Confirmed '+(v.reviewedAt||'—')+' by '+(v.reviewer||'—')+(v.notes?'. Notes: '+esc(v.notes):'')+'</p>';
      html += coachingBoxHtml(d.id, cond, v.coaching);
      html += '<div class="action-row"><button class="btn btn-sm btn-outline-neutral" onclick="reopenVerdict(\''+d.id+'\',\''+cond+'\')">Correct verdict</button></div>';
    } else if(v.status==='rejected'){
      html += '<p class="rule-line">Rejected '+(v.reviewedAt||'—')+' by '+(v.reviewer||'—')+'. Wrongly-scored: '+(v.wrongQs&&v.wrongQs.length?v.wrongQs.join(', '):'—')+(v.notes?'. Notes: '+esc(v.notes):'')+'</p>';
      html += '<div class="action-row"><button class="btn btn-sm btn-outline-neutral" onclick="reopenVerdict(\''+d.id+'\',\''+cond+'\')">Correct verdict</button></div>';
    } else {
      // active pending
      if(v.history && v.history.length){
        const last = v.history[v.history.length-1];
        html += '<p class="rule-line"><em>Previously '+last.status+' '+(last.reviewedAt||'—')+' by '+(last.reviewer||'—')+' — reopened. Record a new verdict below.</em></p>';
      }
      if(gateNeeded){
        html += '<div class="gate-box'+(gatePassed?' gate-ok':'')+'">'+
          (gatePassed ? '&#10003; Audio played — Confirm enabled.' : '&#9888; Play the quoted audio segment before confirming.')+
          (audioDurationOf(d)>0 ? '<button class="jump-inline" onclick="jumpAudio('+gateTimestamp(d,cond)+',\''+cond+'\',\''+d.id+'\')">'+ICONS.play+' Play quoted segment</button>' : '')+
        '</div>';
      }
      html += '<div id="reject-form-'+d.id+'-'+cond+'" style="display:none;">'+
        '<div class="checklist">'+ allQuestionOptions(d).map(o=>'<label><input type="checkbox" data-reject-q="'+o.id+'" data-cond="'+cond+'"> '+o.id+' &mdash; '+esc(RUBRIC.dims[o.dim].qs.find(q=>q.id===o.id).text)+'</label>').join('') +
          '<label><input type="checkbox" data-reject-extra="audio_mismatch" data-cond="'+cond+'"> Evidence quote does not match audio</label>'+
          '<label><input type="checkbox" data-reject-extra="wrong_party" data-cond="'+cond+'"> Wrong party attributed</label>'+
        '</div>'+
        '<textarea class="notes" id="notes-'+d.id+'-'+cond+'" placeholder="Notes (required for reject)"></textarea>'+
        '<div class="action-row"><button class="btn btn-solid" onclick="submitReject(\''+d.id+'\',\''+cond+'\')">Submit Reject</button><button class="btn btn-ghost" onclick="document.getElementById(\'reject-form-'+d.id+'-'+cond+'\').style.display=\'none\'">Cancel</button></div>'+
      '</div>'+
      '<div class="action-row">'+
        '<button class="btn btn-solid" '+(gateNeeded && !gatePassed?'disabled':'')+' onclick="confirmCondition(\''+d.id+'\',\''+cond+'\')">Confirm Flag</button>'+
        '<button class="btn btn-danger-outline" onclick="document.getElementById(\'reject-form-'+d.id+'-'+cond+'\').style.display=\'block\'">Reject Flag</button>'+
      '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}
function coachingBoxHtml(orderId, cond, coaching){
  if(coaching && coaching.done){
    return '<div class="coach-box"><b>Coaching done</b> &middot; '+esc(coaching.date)+(coaching.note?' &mdash; '+esc(coaching.note):'')+'</div>';
  }
  return '<div class="coach-box"><b>Coaching outstanding</b><div class="row">'+
    '<input type="date" id="coach-date-'+orderId+'-'+cond+'">'+
    '<input type="text" id="coach-note-'+orderId+'-'+cond+'" placeholder="Coaching note">'+
    '<button class="btn btn-sm btn-outline" onclick="saveCoaching(\''+orderId+'\',\''+cond+'\')">Mark coaching done</button>'+
  '</div></div>';
}

/* ---- verdict actions ---- */
function nowStamp(){ return {reviewedAtRaw: NOW.toISOString(), reviewedAt: dateLabel(NOW.toISOString())}; }
function wrapUpVerdict(orderId, baseMsg){
  if(isOrderReviewed(orderId)) toast(baseMsg+' — every condition on this order now has a verdict, so it drops out of the Open queue as Reviewed.');
  else toast(baseMsg+' — the next-priority condition on this order is now active.');
  render();
}
// Verdicts "can be corrected" (Requirement 3): reopening puts the condition back to
// pending — its prior verdict is kept in .history so the reviewer sees what's being
// corrected — rather than deleting the record outright.
function reopenVerdict(orderId, cond){
  const d = getDetail(orderId);
  const v = d.verdicts[cond];
  if(!v || v.status==='pending') return;
  v.history = v.history || [];
  v.history.push({status:v.status, reviewer:v.reviewer, reviewedAt:v.reviewedAt, notes:v.notes, wrongQs:v.wrongQs});
  v.status = 'pending'; v.notes=''; v.wrongQs=[];
  toast('Verdict reopened for '+FLAG_LABEL[cond]+' on '+orderId+' — record a new Confirm/Reject to correct it.');
  render();
}
function reopenBlindVerdict(orderId){
  const d = getDetail(orderId);
  const v = d.verdicts.blind;
  if(!v || v.status==='pending') return;
  v.history = v.history || [];
  v.history.push({status:v.status, reviewer:v.reviewer, reviewedAt:v.reviewedAt, notes:v.notes});
  v.status = 'pending'; v.notes='';
  toast('Blind sample verdict reopened for '+orderId+' — record a new verdict to correct it.');
  render();
}
function confirmCondition(orderId, cond){
  const d = getDetail(orderId);
  d.verdicts[cond] = d.verdicts[cond] || {};
  Object.assign(d.verdicts[cond], {status:'confirmed', reviewer:'You (HQE)', coaching:d.verdicts[cond].coaching||{done:false,date:'',note:''}}, nowStamp());
  wrapUpVerdict(orderId, 'Confirmed: '+FLAG_LABEL[cond]+' on '+orderId);
}
function submitReject(orderId, cond){
  const d = getDetail(orderId);
  const wrong = Array.from(document.querySelectorAll('[data-reject-q][data-cond="'+cond+'"]:checked')).map(el=>el.getAttribute('data-reject-q'));
  const extras = Array.from(document.querySelectorAll('[data-reject-extra][data-cond="'+cond+'"]:checked')).map(el=>el.getAttribute('data-reject-extra'));
  const notesEl = document.getElementById('notes-'+orderId+'-'+cond);
  const notes = notesEl ? notesEl.value : '';
  if(!wrong.length && !extras.length){ toast('Select at least one wrongly-scored question or reason'); return; }
  d.verdicts[cond] = d.verdicts[cond] || {};
  Object.assign(d.verdicts[cond], {status:'rejected', wrongQs:wrong.concat(extras), notes, reviewer:'You (HQE)'}, nowStamp());
  wrapUpVerdict(orderId, 'Rejected: '+FLAG_LABEL[cond]+' on '+orderId);
}
function saveCoaching(orderId, cond){
  const d = getDetail(orderId);
  const date = document.getElementById('coach-date-'+orderId+'-'+cond).value || '2026-08-09';
  const note = document.getElementById('coach-note-'+orderId+'-'+cond).value;
  d.verdicts[cond].coaching = {done:true, date, note};
  toast('Coaching marked done for '+orderId);
  render();
}
function blindCorrectlyClean(orderId){
  const d = getDetail(orderId);
  Object.assign(d.verdicts.blind, {status:'confirmed', reviewer:'You (HQE)'}, nowStamp());
  wrapUpVerdict(orderId, 'Recorded: Correctly Clean');
}
function submitBlind(orderId){
  const d = getDetail(orderId);
  const missed = Array.from(document.querySelectorAll('[data-blind-q]:checked')).map(el=>el.getAttribute('data-blind-q'));
  const notes = document.getElementById('blind-notes').value;
  if(!missed.length){ toast('Select at least one missed question'); return; }
  Object.assign(d.verdicts.blind, {status:'rejected', missedQs:missed, notes, reviewer:'You (HQE)'}, nowStamp());
  wrapUpVerdict(orderId, 'Recorded: Should Have Flagged — feeds the miss-rate metric');
}

function openRubric(){
  let body = '<div class="modal-head"><div><h2>SPADE Consultation Rubric</h2><p class="rule-line" style="margin:0;">Rubric version '+RUBRIC.version+' &middot; Appendix B, Phase-1 adaptation</p></div></div>';
  ['S','P','A','E'].forEach(k=>{
    body += '<div class="rubric-dim"><h4>'+k+' — '+RUBRIC.dims[k].label+'</h4><ol>'+ RUBRIC.dims[k].qs.map(q=>'<li>'+esc(q.text)+'</li>').join('') +'</ol></div>';
  });
  body += '<p class="rule-line" style="margin-top:14px;">Display is not evaluated (recordings are audio-only). Dharmik Counselling runs misconduct, integrity (E2) and wrong-language checks only — no SPADE score.</p>';
  openModal(body);
}

/* ============================================================
   VIEW: Not Evaluable Digest  (Requirement 5)
   ============================================================ */
function viewDigest(){
  const byReason = {};
  DIGEST.forEach(e=>{ byReason[e.reason] = (byReason[e.reason]||0)+1; });
  const filteredRows = filteredDigest();
  // Requirement 5: "daily counts by reason" — group by date, not just an aggregate total.
  const reasonKeys = Object.keys(REASON_LABEL);
  const byDate = {};
  filteredRows.forEach(e=>{ (byDate[e.date] = byDate[e.date]||{}); byDate[e.date][e.reason] = (byDate[e.date][e.reason]||0)+1; });
  const dates = Object.keys(byDate).sort().reverse();
  const totalDatePages = Math.max(1, Math.ceil(dates.length/DIGEST_DAY_PAGE_SIZE));
  if(digestDayPage>totalDatePages) digestDayPage = totalDatePages;
  const dateStart = (digestDayPage-1)*DIGEST_DAY_PAGE_SIZE;
  const datesPage = dates.slice(dateStart, dateStart+DIGEST_DAY_PAGE_SIZE);
  const totalOrderPages = Math.max(1, Math.ceil(filteredRows.length/DIGEST_ORDER_PAGE_SIZE));
  if(digestOrderPage>totalOrderPages) digestOrderPage = totalOrderPages;
  const orderStart = (digestOrderPage-1)*DIGEST_ORDER_PAGE_SIZE;
  const orderRowsPage = filteredRows.slice(orderStart, orderStart+DIGEST_ORDER_PAGE_SIZE);
  let html = '<div class="page-head">'+
    '<div><h1 class="page-title">Not Evaluable Orders</h1><p class="page-sub">Completed orders that could not be scored — a pipeline health signal, not a review queue.</p></div>'+
  '</div>'+
  '<div class="stat-cards">'+
    Object.keys(REASON_LABEL).map(r=>statCard(byReason[r]||0, REASON_LABEL[r], 'slate')).join('')+
  '</div>'+
  '<div class="card" style="padding-bottom:16px;">'+
    '<div class="filterbar">'+
      '<div class="search-with-btn">'+
        '<div class="search-box"><span class="sic">&#128269;</span><input id="d-search" placeholder="Search by order ID..." value="'+esc(dpFilter.q)+'" onkeydown="if(event.key===\'Enter\'){event.preventDefault();applyDigestFilters();}"></div>'+
        '<button class="btn btn-ghost" onclick="applyDigestFilters()">Search</button>'+
      '</div>'+
      '<div class="daterange-group">'+ICONS.calendar+
        '<input type="date" id="d-from" value="'+esc(dpFilter.from)+'">'+
        '<span class="daterange-sep">&ndash;</span>'+
        '<input type="date" id="d-to" value="'+esc(dpFilter.to)+'">'+
      '</div>'+
      selectHtml('d-service', dpFilter.service, 'All services', DIGEST_SERVICES, 'service')+
      selectHtml('d-reason', dpFilter.reason, 'All reasons', Object.entries(REASON_LABEL).map(([k,l])=>[k,l]), 'reason')+
      '<button class="btn btn-apply" onclick="applyDigestFilters()">Apply Filter</button>'+
      (isDigestFilterActive()?'<button class="btn btn-ghost" onclick="clearDigestFilters()">Clear all</button>':'')+
    '</div>'+
    activeDigestFilterChipsHtml()+
  '</div>'+
  '<div class="card" style="padding:0;overflow:hidden;">'+
  '<div style="padding:16px 18px 4px;"><h3 style="margin:0 0 2px;border:none;padding-bottom:0;">Daily breakdown</h3><p class="page-sub" style="margin:0 0 8px;">Counts by reason, per day.</p></div>'+
  '<div style="overflow-x:auto;"><table>'+
  '<thead><tr><th>Date</th>'+reasonKeys.map(r=>'<th>'+esc(REASON_LABEL[r])+'</th>').join('')+'<th>Total</th></tr></thead><tbody>'+
  datesPage.map(dt=>{
    const row = byDate[dt];
    const total = reasonKeys.reduce((s,r)=>s+(row[r]||0),0);
    return '<tr style="cursor:default;"><td class="mono">'+dt+'</td>'+
      reasonKeys.map(r=>'<td class="mono">'+(row[r]||0)+'</td>').join('')+
      '<td class="mono" style="font-weight:700;">'+total+'</td></tr>';
  }).join('')+
  '</tbody></table></div>'+
  paginationHtml(dates.length, digestDayPage, totalDatePages, dateStart, datesPage.length, 'days', 'pageDigestDays')+
  '</div>'+
  '<div class="card" style="padding:0;overflow:hidden;">'+
  '<div style="overflow-x:auto;"><table>'+
  '<thead><tr><th>Order</th><th>Service</th><th>Reason</th><th>Date</th><th>Recording</th></tr></thead><tbody>'+
  (orderRowsPage.length ? orderRowsPage.map(e=>'<tr style="cursor:default;">'+
    '<td class="order-id">'+e.id+'</td>'+
    '<td>'+esc(e.service)+'</td>'+
    '<td><span class="pill pill-slate">'+esc(REASON_LABEL[e.reason])+'</span></td>'+
    '<td class="mono">'+e.date+'</td>'+
    '<td><button class="btn btn-sm btn-outline-neutral" onclick="mintLink(\''+e.id+'\')">Get fresh link</button></td>'+
  '</tr>').join('') : '<tr class="empty-row"><td colspan="5">No orders match these filters.</td></tr>')+
  '</tbody></table></div>'+
  paginationHtml(filteredRows.length, digestOrderPage, totalOrderPages, orderStart, orderRowsPage.length, 'orders', 'pageDigestOrders')+
  '</div>'+
  '<p class="rule-line">No-shows are excluded — they\'re recorded separately and never enter any queue.</p>';
  return html;
}
function mintLink(orderId){ toast('Fresh signed recording link minted for '+orderId+' (~14 day expiry)'); }

/* ============================================================
   VIEW: Quality Settings  (Requirement 12)
   ============================================================ */
function viewSettings(){
  let html = '<div class="page-head"><div><h1 class="page-title">Quality Settings</h1><p class="page-sub">Runtime configuration for AQE flagging, tunable without a release.</p></div>'+
    '<div class="head-actions"><span class="lock-badge">'+ICONS.lock+' Admin only</span></div></div>';

  html += '<div class="card">'+
    settingsRow('Shadow mode', 'First week (configurable): everything is scored and stored, but only Misconduct reaches the queue. Thresholds get set from the observed flag rate before other flags go live.', toggleHtml('cfg-shadow', CONFIG.shadowMode))+
    settingsRow('Kill-switch: non-misconduct flags', 'Pauses Integrity / Wrong Language / Low Quality from reaching the queue entirely. Misconduct flags and alerts are never suppressed, by design.', toggleHtml('cfg-kill', CONFIG.killSwitch))+
  '</div>';

  html += '<div class="card"><h3>Low-quality thresholds</h3>'+
    '<div class="two-col">'+
      '<div><div class="settings-row" style="border:none;padding-top:0;"><div><div class="label">Final score &le;</div><div class="desc">Fires Low Quality when the worst scored dimension is at or below this.</div></div><input class="num-input" type="number" min="0" max="3" id="cfg-low-score" value="'+CONFIG.lowScoreThreshold+'"></div></div>'+
      '<div><div class="settings-row" style="border:none;padding-top:0;"><div><div class="label">Dimension average &le;</div><div class="desc">Catches the "spikeless" uniformly-mediocre case a min() rule alone can\'t see.</div></div><input class="num-input" type="number" min="0" max="3" id="cfg-low-avg" value="'+CONFIG.lowAvgThreshold+'"></div></div>'+
    '</div></div>';

  html += '<div class="card">'+
    '<div class="settings-row"><div><div class="label">Blind calibration sample rate</div><div class="desc">% of clean evaluations added to the queue, marked as samples, across all languages. Set to 0 to pause sampling once success-table bars hold.</div></div><div style="display:flex;align-items:center;gap:8px;"><input class="num-input" type="number" min="0" max="100" id="cfg-blind-rate" value="'+CONFIG.blindSampleRate+'">%</div></div>'+
    '<div class="settings-row"><div><div class="label">Queue expiry window</div><div class="desc">Non-misconduct flags expire from the queue unverdicted after this many days (excluded from all metrics). Misconduct never expires.</div></div><div style="display:flex;align-items:center;gap:8px;"><input class="num-input" type="number" min="1" max="90" id="cfg-expiry" value="'+CONFIG.queueExpiryDays+'"> days</div></div>'+
  '</div>';

  html += '<div class="card"><h3>Consequence thresholds <span class="count">(policy — manually enforced)</span></h3>'+
    '<div class="kv"><div class="k">Misconduct / Integrity</div><div class="v" style="font-weight:500;">Any confirmed flag &rarr; immediate 1:1 review with the practitioner.</div>'+
    '<div class="k">Low quality</div><div class="v" style="font-weight:500;">Two confirmed flags on the same Mitra within 30 days &rarr; formal coaching session.</div>'+
    '<div class="k">Repeat flags</div><div class="v" style="font-weight:500;">Continued confirmed flags after coaching &rarr; de-listing review with supply ops.</div></div>'+
    '<p class="rule-line" style="margin-top:10px;margin-bottom:0;">AQE surfaces the signals — repeat-flag count on queue rows, coaching-outstanding state. Applying consequences stays a human decision in Phase-1.</p>'+
  '</div>';

  html += '<div class="action-row"><button class="btn btn-solid" onclick="saveSettings()">Save settings</button><span class="rule-line" style="align-self:center;">Changes apply to future nightly runs only — nothing is re-scored retroactively.</span></div>';
  return html;
}
function toggleHtml(id, on){ return '<div class="toggle'+(on?' on':'')+'" id="'+id+'" onclick="this.classList.toggle(\'on\')"><div class="knob"></div></div>'; }
function settingsRow(label, desc, control){
  return '<div class="settings-row"><div><div class="label">'+esc(label)+'</div><div class="desc">'+esc(desc)+'</div></div>'+control+'</div>';
}
function saveSettings(){
  CONFIG.shadowMode = document.getElementById('cfg-shadow').classList.contains('on');
  CONFIG.killSwitch = document.getElementById('cfg-kill').classList.contains('on');
  CONFIG.lowScoreThreshold = Number(document.getElementById('cfg-low-score').value);
  CONFIG.lowAvgThreshold = Number(document.getElementById('cfg-low-avg').value);
  CONFIG.blindSampleRate = Number(document.getElementById('cfg-blind-rate').value);
  CONFIG.queueExpiryDays = Number(document.getElementById('cfg-expiry').value);
  toast('Settings saved');
}
